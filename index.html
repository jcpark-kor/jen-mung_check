<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMORPG 보스 젠/멍 타이머</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #111827; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #1f2937; border-bottom: 1px solid #374151; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .header-title { display: flex; align-items: center; gap: 8px; font-size: 1.2rem; font-weight: bold; }
        .header-btns { display: flex; gap: 8px; }
        
        button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 14px; font-size: 0.85rem; font-weight: 600; transition: 0.2s; }
        button:hover { opacity: 0.85; }
        .btn-gray { background-color: #374151; color: #fff; }
        .btn-red { background-color: #dc2626; color: #fff; }
        .btn-blue { background-color: #2563eb; color: #fff; }
        .btn-green { background-color: #16a34a; color: #fff; }
        .btn-icon { padding: 4px 8px; font-size: 0.75rem; background-color: #374151; color: #fff; }
        
        main { flex: 1; max-width: 1000px; width: 100%; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        .tabs-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #374151; padding-bottom: 8px; gap: 10px; flex-wrap: wrap; }
        .tabs { display: flex; gap: 4px; overflow-x: auto; }
        .tab-btn { background: transparent; color: #9ca3af; padding: 8px 14px; border-bottom: 2px solid transparent; border-radius: 0; }
        .tab-btn.active { color: #3b82f6; border-bottom: 2px solid #3b82f6; font-weight: bold; }
        
        .form-row { background-color: #1f2937; padding: 16px; border-radius: 8px; border: 1px solid #374151; display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
        .input-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
        .input-group label { font-size: 0.75rem; color: #9ca3af; }
        input, select { background-color: #111827; border: 1px solid #374151; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; outline: none; }
        
        .table-box { background-color: #1f2937; border-radius: 8px; border: 1px solid #374151; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #111827; color: #9ca3af; font-size: 0.75rem; padding: 12px; border-bottom: 1px solid #374151; }
        td { padding: 12px; border-bottom: 1px solid #374151; font-size: 0.85rem; }
        
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; display: inline-block; }
        .badge-fixed { background-color: #1e3a8a; color: #93c5fd; }
        .badge-random { background-color: #581c87; color: #d8b4fe; }
        .badge-zen { background-color: #14532d; color: #86efac; }
        .badge-mong { background-color: #7f1d1d; color: #fca5a5; }
        .badge-wait { background-color: #374151; color: #d1d5db; }
        .badge-done { background-color: #1e40af; color: #bfdbfe; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 99; }
        .modal.hidden { display: none !important; }
        .modal-content { background: #1f2937; border: 1px solid #374151; border-radius: 10px; width: 90%; max-width: 480px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        
        .action-btns { display: flex; gap: 4px; align-items: center; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">⚔️ MMORPG 보스 타이머</div>
        <div class="header-btns">
            <button type="button" id="btnSettings" class="btn-gray">⚙️ 설정</button>
            <button type="button" id="btnResetTab" class="btn-red">🔄 현재 시간대 초기화</button>
        </div>
    </header>

    <main>
        <div class="tabs-row">
            <div id="timeTabs" class="tabs"></div>
            <div style="display:flex; gap:6px;">
                <button type="button" id="btnAddSlot" class="btn-blue" style="font-size:0.75rem;">+ 시간대 추가</button>
                <button type="button" id="btnDeleteSlot" class="btn-gray" style="font-size:0.75rem;">🗑️ 시간대 삭제</button>
            </div>
        </div>

        <div class="form-row">
            <div class="input-group">
                <label>보스 이름</label>
                <input type="text" id="newBossName" placeholder="예: 바포메트">
            </div>
            <div class="input-group" style="max-width:120px;">
                <label>유형</label>
                <select id="newBossType">
                    <option value="fixed">고정 보스</option>
                    <option value="random">확률 보스</option>
                </select>
            </div>
            <button type="button" id="btnAddBoss" class="btn-green">보스 등록</button>
        </div>

        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>유형</th>
                        <th>보스 이름</th>
                        <th>상태</th>
                        <th>시간</th>
                        <th>순서 / 삭제</th>
                    </tr>
                </thead>
                <tbody id="bossTableBody"></tbody>
            </table>
        </div>
    </main>

    <!-- 설정 모달 -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="font-size:1.1rem; font-weight:bold;">⚙️ 구글 스프레드시트 URL 설정</h3>
            <div class="input-group">
                <label>Apps Script Web App URL</label>
                <input type="text" id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button type="button" id="btnCloseModal" class="btn-gray">닫기</button>
                <button type="button" id="btnSaveSettings" class="btn-blue">저장</button>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            var defaultData = {
                timeSlots: ["00:00", "04:00", "08:00", "12:00", "16:00", "20:00"],
                activeTab: "00:00",
                bosses: {
                    "00:00": [
                        { id: 1, name: "고정 보스 예시", type: "fixed", status: "확인", time: "-" },
                        { id: 2, name: "확률 보스 예시", type: "random", status: "대기", time: "-" }
                    ]
                }
            };

            var appData = defaultData;
            try {
                var saved = localStorage.getItem('bossAppData');
                if (saved) {
                    var parsed = JSON.parse(saved);
                    if (parsed && parsed.timeSlots && parsed.bosses) {
                        appData = parsed;
                    }
                }
            } catch(e) {
                appData = defaultData;
            }

            var gasUrl = '';
            try { gasUrl = localStorage.getItem('gasUrl') || ''; } catch(e){}

            function saveAndRender() {
                try { localStorage.setItem('bossAppData', JSON.stringify(appData)); } catch(e){}
                renderTabs();
                renderBossTable();
            }

            function renderTabs() {
                var container = document.getElementById('timeTabs');
                if(!container) return;
                container.innerHTML = '';
                appData.timeSlots.forEach(function(slot) {
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'tab-btn ' + (slot === appData.activeTab ? 'active' : '');
                    btn.innerText = slot + ' 타임';
                    btn.onclick = function() {
                        appData.activeTab = slot;
                        if(!appData.bosses[slot]) appData.bosses[slot] = [];
                        saveAndRender();
                    };
                    container.appendChild(btn);
                });
            }

            function renderBossTable() {
                var tbody = document.getElementById('bossTableBody');
                if(!tbody) return;
                tbody.innerHTML = '';
                var list = appData.bosses[appData.activeTab] || [];

                if(list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#6b7280; padding:20px;">등록된 보스가 없습니다.</td></tr>';
                    return;
                }

                list.forEach(function(boss, index) {
                    var tr = document.createElement('tr');
                    
                    var bClass = 'badge-wait', bText = '대기';
                    if(boss.status === '젠') { bClass = 'badge-zen'; bText = '젠 (출현)'; }
                    else if(boss.status === '멍') { bClass = 'badge-mong'; bText = '멍 (미출현)'; }
                    else if(boss.status === '처치') { bClass = 'badge-done'; bText = '처치 완료'; }

                    var typeBadge = boss.type === 'fixed' 
                        ? '<span class="badge badge-fixed">고정</span>' 
                        : '<span class="badge badge-random">확률</span>';

                    // 고정 보스일 경우 젠/멍 버튼 안 뜨고 '처치/확인' 토글만 가능
                    var statusControls = '';
                    if (boss.type === 'fixed') {
                        statusControls = `
                            <button type="button" class="btn-blue" style="padding:4px 8px; font-size:0.75rem;" onclick="window.updateStatus(${boss.id}, '처치')">처치 완료</button>
                            <span class="badge ${bClass}">${bText}</span>
                        `;
                    } else {
                        statusControls = `
                            <button type="button" class="btn-green" style="padding:4px 8px; font-size:0.75rem;" onclick="window.updateStatus(${boss.id}, '젠')">젠</button>
                            <button type="button" class="btn-red" style="padding:4px 8px; font-size:0.75rem;" onclick="window.updateStatus(${boss.id}, '멍')">멍</button>
                            <span class="badge ${bClass}">${bText}</span>
                        `;
                    }

                    tr.innerHTML = `
                        <td>${typeBadge}</td>
                        <td style="font-weight:bold;">${boss.name}</td>
                        <td>${statusControls}</td>
                        <td style="color:#9ca3af; font-size:0.75rem;">${boss.time}</td>
                        <td>
                            <div class="action-btns">
                                <button type="button" class="btn-icon" onclick="window.moveBoss(${index}, -1)">⬆️</button>
                                <button type="button" class="btn-icon" onclick="window.moveBoss(${index}, 1)">⬇️</button>
                                <button type="button" class="btn-gray" style="padding:2px 6px; font-size:0.7rem;" onclick="window.deleteBoss(${boss.id})">삭제</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            window.updateStatus = function(id, status) {
                var list = appData.bosses[appData.activeTab] || [];
                var boss = list.find(function(b) { return b.id === id; });
                if(boss) {
                    var d = new Date();
                    boss.status = status;
                    boss.time = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
                    saveAndRender();
                    sendToSheet(appData.activeTab, boss.name, status, boss.time);
                }
            };

            // 순서 변경 함수 (⬆️ 위로 / ⬇️ 아래로)
            window.moveBoss = function(index, direction) {
                var list = appData.bosses[appData.activeTab] || [];
                var targetIndex = index + direction;
                if (targetIndex < 0 || targetIndex >= list.length) return;
                
                var temp = list[index];
                list[index] = list[targetIndex];
                list[targetIndex] = temp;
                
                saveAndRender();
            };

            window.deleteBoss = function(id) {
                appData.bosses[appData.activeTab] = (appData.bosses[appData.activeTab] || []).filter(function(b) { return b.id !== id; });
                saveAndRender();
            };

            function sendToSheet(sheetName, bossName, status, time) {
                if(!gasUrl) return;
                try {
                    fetch(gasUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sheetName: sheetName, bossName: bossName, status: status, time: time })
                    }).catch(function(){});
                } catch(e){}
            }

            document.getElementById('btnSettings').onclick = function() {
                document.getElementById('gasUrlInput').value = gasUrl;
                document.getElementById('settingsModal').classList.remove('hidden');
            };
            document.getElementById('btnCloseModal').onclick = function() {
                document.getElementById('settingsModal').classList.add('hidden');
            };
            document.getElementById('btnSaveSettings').onclick = function() {
                gasUrl = document.getElementById('gasUrlInput').value.trim();
                try { localStorage.setItem('gasUrl', gasUrl); } catch(e){}
                alert('설정이 저장되었습니다.');
                document.getElementById('settingsModal').classList.add('hidden');
            };

            document.getElementById('btnResetTab').onclick = function() {
                if(confirm('[' + appData.activeTab + ' 타임]의 모든 보스를 초기화하시겠습니까?')) {
                    (appData.bosses[appData.activeTab] || []).forEach(function(b) { b.status = '대기'; b.time = '-'; });
                    saveAndRender();
                    sendToSheet(appData.activeTab, 'ALL', 'RESET', 'NOW');
                }
            };

            document.getElementById('btnAddSlot').onclick = function() {
                var slot = prompt('추가할 시간대 입력 (예: 02:00):');
                if(slot && appData.timeSlots.indexOf(slot) === -1) {
                    appData.timeSlots.push(slot);
                    appData.timeSlots.sort();
                    appData.activeTab = slot;
                    if(!appData.bosses[slot]) appData.bosses[slot] = [];
                    saveAndRender();
                }
            };
            document.getElementById('btnDeleteSlot').onclick = function() {
                if(appData.timeSlots.length <= 1) {
                    alert('최소 1개의 시간대는 유지되어야 합니다.');
                    return;
                }
                if(confirm('[' + appData.activeTab + ' 타임]을 삭제하시겠습니까?')) {
                    var target = appData.activeTab;
                    appData.timeSlots = appData.timeSlots.filter(function(s) { return s !== target; });
                    delete appData.bosses[target];
                    appData.activeTab = appData.timeSlots[0];
                    saveAndRender();
                }
            };

            document.getElementById('btnAddBoss').onclick = function() {
                var nameEl = document.getElementById('newBossName');
                var typeEl = document.getElementById('newBossType');
                var name = nameEl.value.trim();
                if(!name) { alert('보스 이름을 입력해주세요.'); return; }
                
                if(!appData.bosses[appData.activeTab]) appData.bosses[appData.activeTab] = [];
                appData.bosses[appData.activeTab].push({
                    id: Date.now(),
                    name: name,
                    type: typeEl.value,
                    status: '대기',
                    time: '-'
                });
                nameEl.value = '';
                saveAndRender();
            };

            saveAndRender();
        });
    </script>
</body>
</html>
